<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>那时 - 设备端</title>
		<link rel="stylesheet" href="/style.css" />
		<script src="/i18n.js" defer></script>
		<script src="/app.js" defer></script>
	</head>
	<body data-view="library">
		<header class="topbar">
			<div class="title">
				<h1 data-i18n="title">那时 - 设备端</h1>
				<p class="muted small" id="subtitle"></p>
			</div>
			<div class="status">
				<span id="pill" class="pill"><i></i><span></span></span>
				<button id="toggle" class="btn" hidden></button>
				<a id="open-settings" class="icon-btn" href="#settings" data-i18n-title="nav.settings">
					<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
						<circle cx="12" cy="12" r="3" />
						<path
							d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
						/>
					</svg>
				</a>
			</div>
		</header>

		<div class="alerts">
			<section id="need" class="notice" hidden></section>
			<p id="error" class="error" hidden></p>
		</div>

		<!-- 相册视图：左边文件夹和照片，右边正在进行的任务 -->
		<div id="view-library" class="layout">
			<main id="library" class="library">
				<div class="lib-head">
					<nav id="crumbs" class="crumbs" aria-label="breadcrumb"></nav>
					<div class="lib-actions">
						<button id="up-files" class="btn primary" data-i18n="upload.pickFiles"></button>
						<button id="up-dir" class="btn" data-i18n="upload.pickFolder"></button>
						<input id="up-input-files" type="file" multiple hidden />
						<input id="up-input-dir" type="file" webkitdirectory multiple hidden />
					</div>
				</div>
				<p id="up-hint" class="muted small"></p>
				<p id="lib-error" class="error small" hidden></p>
				<div id="folders" class="folders"></div>
				<div id="photos" class="photos"></div>
				<p id="lib-empty" class="empty" data-i18n="library.empty" hidden></p>
				<div><button id="lib-more" class="btn" data-i18n="library.more" hidden></button></div>
				<div id="drop" class="drop" hidden><span data-i18n="library.drop"></span></div>
			</main>

			<aside class="tasks">
				<section class="stats">
					<div class="stat"><span class="label" data-i18n="stats.active"></span><strong id="s-active">–</strong><span class="sub" id="s-active-sub"></span></div>
					<div class="stat"><span class="label" data-i18n="stats.rate"></span><strong id="s-rate">–</strong><span class="sub" data-i18n="stats.rateSub"></span></div>
					<div class="stat"><span class="label" data-i18n="stats.queue"></span><strong id="s-queue">–</strong><span class="sub" id="s-queue-sub"></span></div>
					<div class="stat"><span class="label" data-i18n="stats.done"></span><strong id="s-done">–</strong><span class="sub" id="s-done-sub"></span></div>
				</section>

				<section id="up-progress" class="panel" hidden>
					<div class="row"><h2 data-i18n="upload.title"></h2></div>
					<div class="bar"><i id="up-fill"></i></div>
					<p id="up-text" class="small"></p>
					<p id="up-alert" class="error small" hidden></p>
					<div class="upload-actions">
						<button id="up-cancel" class="btn small-btn" data-i18n="upload.cancel" hidden></button>
						<button id="up-resume" class="btn small-btn" data-i18n="upload.resume" hidden></button>
						<button id="up-clear" class="btn small-btn" data-i18n="upload.clear" hidden></button>
					</div>
					<ul id="up-list" class="failures"></ul>
				</section>

				<section class="panel">
					<div class="row"><h2 data-i18n="sections.active"></h2></div>
					<div id="active" class="cards"></div>
					<p id="active-empty" class="empty" data-i18n="empty.active"></p>
				</section>

				<section class="panel">
					<div class="row">
						<h2 data-i18n="sections.recent"></h2>
						<span class="muted small" id="recent-sub"></span>
					</div>
					<div id="recent" class="strip"></div>
					<p id="recent-empty" class="empty" data-i18n="empty.recent"></p>
					<ul id="failures" class="failures"></ul>
				</section>
			</aside>
		</div>

		<!-- 设置视图（#settings）：和相册在同一个页面里，切换时正在发送的文件不会中断 -->
		<div id="view-settings" class="settings-page">
			<div class="settings-head">
				<a id="settings-back" class="btn" href="#" data-i18n="nav.back"></a>
				<h2 class="page-title" data-i18n="nav.settings"></h2>
			</div>
			<form id="config">
				<fieldset>
					<legend data-i18n="settingsPage.connection"></legend>
					<label><span data-i18n="form.site"></span><input name="site" type="url" placeholder="https://photos.example.com" required /></label>
					<label><span data-i18n="form.name"></span><input name="name" maxlength="64" /></label>
				</fieldset>
				<fieldset>
					<legend data-i18n="settingsPage.processing"></legend>
					<label><span data-i18n="form.concurrency"></span><input name="concurrency" type="number" min="1" max="64" /><span id="cpus" class="muted small"></span></label>
					<label class="check"><input name="autoAttach" type="checkbox" /><span data-i18n="form.autoAttach"></span></label>
				</fieldset>
				<fieldset>
					<legend data-i18n="settingsPage.interface"></legend>
					<label
						><span data-i18n="form.language"></span
						><select name="lang">
							<option value="auto" data-i18n="form.auto"></option>
							<option value="zh-CN">简体中文</option>
							<option value="en">English</option>
						</select></label
					>
				</fieldset>
				<div class="form-actions">
					<button class="btn primary" data-i18n="form.save"></button>
					<span id="saved" class="muted small" data-i18n="form.saved" hidden></span>
				</div>
			</form>
		</div>
	</body>
</html>
