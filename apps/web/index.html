<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="referrer" content="no-referrer" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)" />
		<meta name="color-scheme" content="light dark" />
		<!-- 外观设置：必须在 theme-color 之后、同步执行 -->
		<script src="/theme.js"></script>
		<title>那时</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<!-- 所有静态资源都要鉴权：manifest 默认不带 Cookie，必须 use-credentials，否则会被 Access 拦下 -->
		<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
		<!-- iOS 主屏幕：不读 manifest 的图标和名称 -->
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="那时" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
	</head>
	<body>
		<!-- 启动画面：JS 执行之前的加载态，外壳渲染后由 src/ui/splash.ts 淡出移除（样式在 styles.css 的 .app-splash） -->
		<div id="splash" class="app-splash" aria-hidden="true">
			<svg width="72" height="72" viewBox="0 0 32 32">
				<rect width="32" height="32" rx="8" fill="#17191c" />
				<g fill="none" stroke="#fafaf8" stroke-width="1.6" stroke-linecap="round">
					<circle cx="16" cy="16" r="10" />
					<path d="M16 12L25.97 16.8M19.13 13.51L21.59 24.29M19.9 16.89L13 25.54M17.74 19.6L6.67 19.6M14.26 19.6L7.37 10.95M12.1 16.89L14.56 6.1M12.87 13.51L22.84 8.71" />
				</g>
				<path d="M16 12L19.13 13.51L19.9 16.89L17.74 19.6L14.26 19.6L12.1 16.89L12.87 13.51Z" fill="#f2b544" />
			</svg>
			<div class="app-splash-bar"></div>
		</div>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
